apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-docker-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-docker
  template:
    metadata:
      labels:
        app: kubernetes-docker
    spec:
      containers:
        - name: kubernetes-docker-container
          image: varsha0510/kubernetes-docker-task:v1
          ports:
            - containerPort: 80